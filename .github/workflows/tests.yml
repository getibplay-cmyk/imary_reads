name: Imary Reads checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imary_test
          POSTGRES_USER: imary_test
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imary_test -d imary_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, dom, curl, fileinfo, gd, zip, pcntl, pdo_sqlite, pdo_pgsql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Application and security tests
        run: vendor/bin/phpunit --log-junit test-results.xml
        env:
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'imary_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: imary_test
          DB_PASSWORD: test-only-password
      - run: php artisan view:cache
      - run: php artisan route:cache
      - run: composer audit
      - run: npm audit --audit-level=moderate
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build production application
        run: docker build --target app --tag imary-reads:ci .
      - name: Build web server
        run: docker build --target web --tag imary-reads-web:ci .
      - name: Validate web configuration
        run: docker run --rm -e SITE_DOMAIN=localhost imary-reads-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
